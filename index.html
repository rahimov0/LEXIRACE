<meta name="theme-color" content="#14110f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#14110f;--card:#1c1815;--line:#2f2924;--ink:#f3ede5;--mut:#a0958a;--grey:#2b2520;--acc:#f0a040;--accd:#1b1206;--gold:#ffc65c;--green:#58b585;--yel:#e8b84a;--red:#e56a55;--blue:var(--acc);--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f1ea;--card:#fff;--line:#e6ddd1;--ink:#1d1712;--mut:#857a6e;--grey:#ece4d9;--acc:#d97a1a;--accd:#fff;--gold:#c27a10;--green:#2f9a63;--yel:#c9951c;--red:#d4452f}}
:root[data-theme="light"]{--bg:#f6f1ea;--card:#fff;--line:#e6ddd1;--ink:#1d1712;--mut:#857a6e;--grey:#ece4d9;--acc:#d97a1a;--accd:#fff;--gold:#c27a10;--green:#2f9a63;--yel:#c9951c;--red:#d4452f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;min-height:100vh}main{width:100%;max-width:460px;padding:18px 16px 92px}
.logo,.num,.w,h1,h2,h3,.sec,.big{font-family:Outfit,Inter,system-ui,sans-serif}
.logo{font-weight:800;font-size:26px;letter-spacing:-.5px;margin:0;line-height:1}.logo b{color:var(--acc)}.tag{font-size:10px;letter-spacing:2.4px;color:var(--mut);font-weight:600;margin-top:6px}.hdr{margin-bottom:14px}
h2{margin:18px 2px 8px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:600}h3{margin:0 0 4px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:12px 16px;font:600 14.5px Inter,sans-serif;cursor:pointer;background:var(--acc);color:var(--accd);width:100%;transition:transform .1s,filter .15s}.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(1.05)}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.know{background:var(--green);color:#0c1a12}.btn.again{color:var(--acc)}.btn:disabled{opacity:.45;cursor:default}.danger{color:var(--red)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}.i{flex:none;vertical-align:-3px}.note{font-size:12.5px;color:var(--mut);line-height:1.5}
.kpis{display:flex;gap:6px}.kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;color:var(--mut)}.kpi b{display:block;font:700 17px Outfit,sans-serif;color:var(--ink);margin:3px 0 0}.kpi span{font-size:10.5px}
.lvs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.lv{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}.lv b{font:700 15px Outfit,sans-serif}.lv small{font-size:9.5px;color:var(--mut);white-space:nowrap}.lv em{display:none}.lv.on{background:var(--acc);border-color:var(--acc);color:var(--accd)}.lv.on small{color:var(--accd);opacity:.8}
.segc{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}.segc button{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border:0;border-radius:10px;background:transparent;color:var(--mut);font:600 14px Inter,sans-serif;cursor:pointer}.segc .on{background:var(--acc);color:var(--accd)}
.seg{display:flex;gap:6px}.seg .btn{padding:10px;font-size:13.5px}.seg .on{background:var(--acc);color:var(--accd);border-color:var(--acc)}
.cta{margin-top:12px;padding:14px;font-size:15.5px}.cta small{opacity:.7;font-weight:500}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}.nav div{display:flex;width:100%;max-width:460px;gap:4px}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font:600 11px Inter,sans-serif;padding:7px 4px;border-radius:12px;cursor:pointer}.nav .on{color:var(--acc)}.nav span{position:relative}.bd{font-style:normal;position:absolute;top:-4px;right:-18px;background:var(--red);color:#fff;border-radius:8px;padding:0 5px;font-size:9.5px}
.mi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--grey);color:var(--ink);flex:none}.mi.sm{width:32px;height:32px}.mi.lg{width:52px;height:52px;border-radius:16px;margin:0 auto 10px}.mi.ok{background:var(--green);color:#0c1a12}
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.set:last-child{border:0}.sx{flex:1}.sx b{display:block;font-size:14px}
.sw{width:44px;height:26px;border-radius:14px;border:0;background:var(--grey);position:relative;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}.sw[aria-pressed=true]{background:var(--acc)}.sw[aria-pressed=true]::after{left:21px}
select,input[type=text]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-top:8px}
@keyframes up{from{opacity:0;transform:translateY(8px)}}@keyframes br{50%{opacity:.3}}@keyframes eq{from{height:4px}to{height:16px}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes pop{40%{transform:scale(1.1)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes swap{from{opacity:0;transform:scale(.9)}}
.in{animation:up .3s both}.swap{animation:swap .25s both}.pop{animation:pop .35s}.shake{animation:shake .3s}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#stage{position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;max-width:460px;height:100dvh;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden;--rs:132px}#stage.kb{--rs:80px}
.top{display:flex;gap:6px;align-items:center}.top .sp{flex:1}.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 10px;font:600 12px Inter,sans-serif;color:var(--ink)}.pill b{font-weight:700}.pill b.cg{color:var(--green)}.pill b.cy{color:var(--yel)}.pill b.cr{color:var(--red)}.pill b+b{margin-left:5px}
.ibtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}.pasb{cursor:pointer;color:var(--yel);border-color:color-mix(in srgb,var(--yel) 45%,var(--line))}.pasb:disabled{opacity:.4}
.abc{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}#stage.kb .abc{display:none}
.abc span,.strip span{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font:700 10.5px Outfit,sans-serif;background:var(--grey);color:var(--mut);transition:background .25s,transform .25s}.abc .cur{background:var(--acc);color:var(--accd);transform:scale(1.15)}.g{background:var(--green)!important;color:#0c1a12!important}.y{background:var(--yel)!important;color:#241b00!important}.r{background:var(--red)!important;color:#fff!important}
.strip{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.strip span{width:26px;height:26px;font-size:11px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:2px}
.ringw{position:relative;width:var(--rs);height:var(--rs)}.ringw svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.rb{fill:none;stroke:var(--grey);stroke-width:6}.rf{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;stroke-dasharray:364.4;stroke-dashoffset:0}.warn .rf{stroke:var(--red)}
.big{position:absolute;inset:calc(var(--rs)*.12);border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--acc);font-size:calc(var(--rs)*.42);font-weight:800;display:grid;place-items:center;transition:background .25s,color .25s}.big.g{background:var(--green);color:#0c1a12}.big.y{background:var(--yel);color:#241b00}.big.r{background:var(--red);color:#fff}

 const sc=v=>(v.lang.replace("_","-")===want?100:20)+(/natural|online|neural/i.test(v.name)?30:0)+(FEM.test(v.name)?25:0)-(MALE.test(v.name)&&!/female/i.test(v.name)?60:0);

function speakNow(t,again,id){if(id!==spk)return;const ss=speechSynthesis,u=UT=new SpeechSynthesisUtterance(t),v=bestVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang=db.settings.accent==="UK"?"en-GB":"en-US";u.rate=.9;let ok=false;u.onstart=()=>{ok=true;lastSp=Date.now()};u.onend=()=>{lastSp=Date.now();if(UT===u)UT=null};u.onerror=e=>{if(again&&e.error!=="canceled"&&e.error!=="interrupted")setTimeout(()=>speak(t,false,true),150)};try{ss.resume()}catch(e){}ss.speak(u);setTimeout(()=>{if(id===spk&&!ok&&again&&!ss.speaking)speak(t,false,true)},1000)}
