<style>

:root[data-theme="dark"]{--bg:#070a1c;--card:#10152f;--ink:#f3f4fd;--mut:#9aa2c8;--line:#232a52;--grey:#272e5a;--gold:#ffd23f;--glow:rgba(74,104,255,.22)}
*{box-sizing:border-box}html,body{margin:0;color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg)}
body{min-height:100vh;display:flex;justify-content:center;background:radial-gradient(900px 420px at 50% -80px,var(--glow),transparent 70%),var(--bg)}
main{width:100%;max-width:520px;padding:20px 16px 100px}
.logo,.num,.big,.w,h1,h2{font-family:Outfit,Inter,system-ui,sans-serif}
.logo{font-weight:900;font-size:46px;letter-spacing:-2px;margin:0;line-height:1}.logo b{color:var(--gold)}
.tag{letter-spacing:3.5px;font-size:11px;font-weight:700;color:var(--mut);margin:8px 0 22px}
h2{margin:0 0 12px;font-size:13px;letter-spacing:1.8px;text-transform:uppercase;color:var(--mut);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 8px 30px rgba(10,14,40,.08)}
.btn{border:0;border-radius:16px;padding:16px 20px;font:700 16px Inter,system-ui,sans-serif;cursor:pointer;background:var(--blue);color:#fff;width:100%;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.06)}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.pas{background:var(--yel);color:#241b00}.btn.gold{background:var(--gold);color:#241b00;font-size:18px;padding:18px}.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.chip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center}.chip b{display:block;font:800 22px Outfit,sans-serif}.chip span{font-size:11px;color:var(--mut)}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lv{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;padding:12px 4px;font:900 20px Outfit,sans-serif;cursor:pointer}
.lv small{display:block;font:500 11px Inter,sans-serif;color:var(--mut)}.lv.on{border-color:var(--blue);background:var(--blue);color:#fff}.lv.on small{color:#e4e9ff}
.seg{display:flex;gap:8px}.seg .btn{padding:12px;font-size:14px}.seg .on{background:var(--blue);color:#fff;border-color:var(--blue)}
.abc{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0 14px}
.abc span,.strip span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 12px Outfit,sans-serif;background:var(--grey);color:var(--ink);transition:background .25s,transform .25s}
.abc .cur{background:var(--blue);color:#fff;transform:scale(1.22)}.g{background:var(--green)!important;color:#fff!important}.y{background:var(--yel)!important;color:#241b00!important}.r{background:var(--red)!important;color:#fff!important}
.strip{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.ringw{position:relative;width:170px;height:170px;margin:0 auto 6px}.ringw svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rb{fill:none;stroke:var(--grey);stroke-width:7}.rf{fill:none;stroke:var(--blue);stroke-width:7;stroke-linecap:round;stroke-dasharray:364.4;stroke-dashoffset:0;transition:stroke .2s}.warn .rf{stroke:var(--red)}
.big{position:absolute;inset:16px;border-radius:50%;background:var(--blue);color:#fff;font-size:76px;font-weight:900;display:grid;place-items:center;transition:background .25s}
.big.g{background:var(--green)}.big.y{background:var(--yel)}.big.r{background:var(--red)}
.sec{text-align:center;font:800 30px Outfit,sans-serif}.warn .sec{color:var(--red)}
.def{font-size:21px;text-align:center;line-height:1.4;min-height:92px;margin:8px 2px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
.mic{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);min-height:24px;margin-top:10px}.dot{width:12px;height:12px;border-radius:50%;background:var(--grey);flex:none}.dot.on{background:var(--red);animation:p 1s infinite}

.fb{text-align:center;font-weight:700;font-size:17px;min-height:62px}

.ov{position:fixed;inset:0;background:rgba(4,6,18,.72);display:grid;place-items:center;z-index:20;padding:16px}.ov .card{width:min(100%,360px);margin:0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}

.bd{background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;margin-left:4px;font-size:11px}
.wc{text-align:center;padding:28px 20px;min-height:310px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.wc .lt{align-self:center;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--mut)}.wc .w{font-size:44px;font-weight:900;color:var(--gold);word-break:break-word}.wc .x{font-size:19px;line-height:1.5}
.pager{display:flex;gap:8px;align-items:center}.pager .btn{padding:13px}.pager .c{min-width:74px;text-align:center;font-weight:800;color:var(--mut)}
.hero{text-align:center;padding:24px 16px}.acc{position:relative;width:150px;height:150px;margin:0 auto 10px}.acc svg{transform:rotate(-90deg)}.acc .num{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:900}
.hero h1{margin:6px 0 4px;font-size:28px}.badge{display:inline-block;background:var(--gold);color:#241b00;font-weight:800;font-size:12px;border-radius:20px;padding:5px 12px;margin:4px 3px}.badge.d{background:var(--grey);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.tile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--grey);border-radius:14px;padding:10px 4px;text-align:center}.tile b{display:block;font:900 24px Outfit,sans-serif}.tile span{font-size:11px;color:var(--mut)}
.fl{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;padding-bottom:4px}.fl button{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:20px;padding:7px 13px;font:700 13px Inter,sans-serif;cursor:pointer}.fl .on{background:var(--ink);color:var(--bg)}
.res{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.res:last-child{border:0}.res .l{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px Outfit,sans-serif;flex:none}.res .t{flex:1;line-height:1.4}.res button{background:none;border:0;font-size:19px;cursor:pointer}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:2px 7px;margin-right:6px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.set:last-child{border:0}.set b{display:block;font-size:15px}
.sw{width:50px;height:30px;border-radius:20px;border:0;background:var(--grey);position:relative;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.sw[aria-pressed=true]{background:var(--green)}.sw[aria-pressed=true]::after{left:23px}
